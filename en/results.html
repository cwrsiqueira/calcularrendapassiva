  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V1JD0D4KM1"></script>

<body>

  <button id="backToTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>

  <div class="wrapper">
    <main class="content">
      <div class="calculadora-container page-resultado">
        <script src="/js/header-card.js?v=2026110701"></script>

        <!-- CRP top -->
        <div class="ad-top">
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5865817649832793" data-ad-slot="8539778688" data-ad-format="horizontal" data-full-width-responsive="true"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- Resultado: flip card já virado -->
        <section class="flip-card flip-card-flipped" aria-label="Simulation result">
          <div class="flip-card-inner">
            <div class="flip-card-front flip-loading">
              <div class="spinner" role="status"></div>
              <p>Opening the calculator…</p>
            </div>

            <div class="flip-card-back" id="resultado">
              <div class="calc-head">
                <h1 class="calc-title">Your result</h1>
                <a href="/en/articles/how-to-use-passive-income-calculator" class="btn-icon" title="How to read the results" aria-label="How to read the results"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></a>
              </div>
              <div class="result-hero">
                <p class="result-lead" id="resLead"></p>
                <p class="result-big" id="resBig"></p>
                <p class="result-sub" id="resSub"></p>
              </div>
              <ul class="result-chips" id="resChips"></ul>
              <dl class="result-list" id="resLista"></dl>
              <p class="result-disclaimer" id="resAviso"></p>
              <p class="result-fontes" id="resFontes"></p>
              <div class="calc-actions">
                <button type="button" class="btn-primary" id="voltarBtn"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> New simulation</button>
                <a href="#sec-compartilhar" class="btn-secondary"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i> Share</a>
              </div>
            </div>
          </div>
        </section>

        <div class="result-grid">
          <section id="sec-compartilhar" class="card" aria-label="Share your result">
            <div class="card-header"><span class="card-icon"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i></span><h2 class="card-title">Share your result</h2></div>
            <div class="share-preview"><canvas id="cardCompartilhar" aria-label="Share your result"></canvas></div>
            <p class="card-note">Tap the card to see it full size.</p>
            <div class="share-buttons">
              <button type="button" class="btn-share btn-whatsapp" onclick="compartilharWhatsApp()"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> WhatsApp</button>
              <button type="button" class="btn-share btn-secondary" onclick="compartilharResultado()"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i> Share image</button>
            </div>
          </section>

          <section id="sec-grafico" class="card chart-card" aria-label="Balance over time">
            <div class="card-header"><span class="card-icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span><h2 class="card-title">Balance over time</h2></div>
            <div class="chart-container"><canvas id="graficoPatrimonio" aria-label="Balance over time"></canvas></div>
          </section>
        </div>

        <script src="/js/sections.js?v=2026110701" data-pagina="resultado"></script>
        <script src="/js/ads.js"></script>
      </div>
    </main>

    <footer>

        <a href="https://www.linkedin.com/in/carloswagner1975/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin" aria-hidden="true"></i></a>
      </div>
    </footer>
  </div>
